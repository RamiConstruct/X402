<!-- Menu flottant commun du laboratoire (copié dans chaque page ; source : site/nav/nav.html). Fonctionne sans JavaScript. -->
<style>
.labfab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:1000;font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.labfab summary{list-style:none;width:52px;height:52px;border-radius:50%;background:#0f766e;color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:22px;user-select:none}
.labfab summary::-webkit-details-marker{display:none}
.labfab summary:focus-visible{outline:3px solid #5eead4;outline-offset:3px}
.labfab[open] summary{background:#134e4a}
.labfab nav{position:absolute;right:0;bottom:64px;min-width:230px;background:#101317;border:1px solid #2a313b;border-radius:14px;padding:8px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
.labfab .t{display:block;padding:6px 10px 8px;color:#5eead4;font-weight:700;font-size:13px;letter-spacing:.04em}
.labfab a{display:block;color:#d6dbe3;text-decoration:none;padding:10px 12px;border-radius:9px}
.labfab a:hover,.labfab a:focus-visible{background:#1c2229;color:#fff;outline:none}
.labfab a[aria-current="page"]{background:#1f3a37;color:#fff;font-weight:600}
.labfab a small{display:block;color:#8b94a3;font-size:12px;margin-top:2px}
</style>
<details class="labfab">
