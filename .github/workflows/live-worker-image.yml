# Construit et publie l'image du moteur GPU AI LIVE (StreamDiffusion) sur GitHub Container Registry.
# Image : ghcr.io/ramiconstruct/x402-live-worker:<branche> et :<sha court>
# Déclenchement : modification de l'image ou du code du worker, ou lancement manuel.
name: live-worker-image

on:
  push:
    paths:
      - "ai_live/Dockerfile.worker"
      - "ai_live/live/worker/**"
      - "ai_live/pyproject.toml"
      - ".github/workflows/live-worker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: live-worker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Libérer de l'espace disque (image CUDA + PyTorch + TensorRT ≈ 15 Go)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Nom de l'image en minuscules
        id: img
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/x402-live-worker" >> "$GITHUB_OUTPUT"
          echo "branch=$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: ai_live
          file: ai_live/Dockerfile.worker
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.branch }}
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=AI LIVE worker GPU (StreamDiffusion, Daydream fork)
      # Le contrôle d'import est fait dans le Dockerfile pendant la construction :
      # re-télécharger l'image (~10 Go) ici saturait le disque de la machine GitHub.
