[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-studio"
version = "0.1.0"
description = "Pilote A — AI STUDIO : édition vidéo par instructions naturelles, devis avant exécution, grand livre de crédits."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.setuptools.package-data]
studio = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
