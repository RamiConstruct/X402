[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-live"
version = "0.1.0"
description = "Pilote B — AI LIVE : transformation de stream en temps réel (Daydream ou StreamDiffusion auto-hébergé)."
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
worker = ["aiortc>=1.9", "numpy>=1.26", "av>=12"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "aiortc>=1.9", "numpy>=1.26", "av>=12"]

[tool.setuptools.packages.find]
include = ["live*"]

[tool.setuptools.package-data]
live = ["static/*", "references/manifest.json", "references/*.md", "references/*.html", "references/*/*/*.jpg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
